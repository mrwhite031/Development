<!DOCTYPE html>
<html>
   <head>
      <title>Image Practice</title>
      <style>
         img {
            height: 200px;
            margin-right: 10px;
            margin-bottom: 10px;
         }

         .one {
            border-radius: 10px;
         }

         .two {
            height: 200px;
            width: 200px;
            object-fit: cover;
            object-position: center;
         }

         .three {
            height: 200px;
            width: 200px;
            object-fit: cover;
            object-position: center;
            border-radius: 100px;
            
         }
      </style>
   </head>
   <body>
      <img class="one" src="gojo.jpeg">
      <img class="two" src="gojo.jpeg">
      <img class="three" src="gojo.jpeg">
   </body>
</html>
